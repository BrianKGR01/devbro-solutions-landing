<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Favicon: cuadrado achaflanado (misma logica que Placa.astro, clip-path
       via poligono, nunca border-radius -- D2). No puede leer las custom
       properties de tokens.css (recurso standalone fuera del documento),
       asi que los hex de aca son copia literal de --tinta/--verde/--papel
       (docs/06-decisiones.md D25). La "D" es un poligono con corte a 45
       grados en el borde de la panza, no un arco -- mismo lenguaje de
       chaflan que el resto de la marca, sin depender de una fuente web
       que un favicon standalone no puede cargar. -->
  <polygon
    points="7,1 25,1 31,7 31,25 25,31 7,31 1,25 1,7"
    fill="#080B09"
    stroke="#1D7A52"
    stroke-width="2"
  />
  <polygon points="10,8 19,8 23,12 23,20 19,24 10,24" fill="#EDEFEA" />
  <polygon points="15,12 18,12 20,14.5 20,17.5 18,20 15,20" fill="#080B09" />
</svg>
